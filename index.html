<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beton-Basti Steuerung</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;
  --accent:#2f5d50;--accent-soft:#e3eee9;--warn:#9a5b00;--warn-soft:#fbf0dc;--bad:#a23b2c;
  --radius:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151614;--card:#1f201e;--ink:#ecebe6;--muted:#9c9b94;--line:#33342f;
  --accent:#7cc0a8;--accent-soft:#23332d;--warn:#e0a54a;--warn-soft:#3a2f1c;--bad:#e58a7a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:860px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:860px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--card);font-size:12px;margin-left:4px;text-align:center}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:16px 0 8px}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0;flex:1}
.chev{color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{flex:1;min-width:0}
.row .lbl b{font-weight:600;display:block}
.row .lbl small{color:var(--muted);display:block}
input[type=text],input[type=number],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.row input[type=number]{width:90px}
.row input[type=text],.row select{width:220px;max-width:45vw}
textarea{min-height:80px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.15s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:.15s;box-shadow:0 1px 2px #0003}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;padding:5px 6px 5px 10px;cursor:pointer;user-select:none;background:var(--card)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip input{margin:0;accent-color:var(--accent)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--warn-soft)}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600}
.btn.sm{padding:4px 9px;font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.muted{color:var(--muted)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.portal{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.portal .meta{grid-column:1/-1;display:grid;gap:6px}
.portal .name{font-weight:600}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--warn-soft);color:var(--warn)}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.grp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grp-h b{flex:1}
.plz{display:grid;grid-template-columns:70px 1fr auto;gap:4px 8px;align-items:center;font-size:14px}
.changes li{margin:4px 0}
.landkopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flag{font-size:22px;margin-right:4px}
.order{display:flex;gap:2px}
.empty{color:var(--muted);font-style:italic}
@media (max-width:560px){
  .row{flex-wrap:wrap}
  .row input[type=text],.row select{width:100%;max-width:none}
}
</style>
</head>

function diff(a, b, pfad, text, ops) {

    const lt = LISTE[pfad[pfad.length - 1]];

    b.forEach((x, i) => {

    });

    }

    const x = a[k], y = b[k];

}

      b.onchange = () => { p.beschreibung = b.value.trim(); neu(); }; meta.append(b);
    }
    const u = el(`<input type="url" placeholder="${esc(urlHinweis)}" value="${esc(p.url)}">`);
    u.onchange = () => { p.url = u.value.trim(); neu(); }; meta.append(u);
    box.append(r);
  });
  const f = el(`<div class="grp"><b>Portal hinzufügen</b>
    <div style="display:grid;gap:6px;margin-top:8px">
      <input type="text" name="n" placeholder="Name, zum Beispiel homegate.ch">
      <input type="url" name="u" placeholder="Link zur Suchseite mit Ergebnisliste">
      ${mitBeschreibung ? '<input type="text" name="b" placeholder="Kurze Beschreibung, optional">' : ""}
      <div><button class="btn sm">Portal hinzufügen</button></div>
    </div>
    <p class="muted" style="margin:6px 0 0;font-size:13px">Neue Portale werden beim Einpflegen einmal getestet und erst danach durchsucht.</p></div>`);
  f.querySelector("button").onclick = () => {
    const n = f.querySelector("[name=n]").value.trim(); if (!n) return;
    if (portale.some(p => p.name === n)) return alert("Dieses Portal gibt es schon.");
    const p = {name: n, status: "neu, ungeprüft", url: f.querySelector("[name=u]").value.trim()};
    if (mitBeschreibung) p.beschreibung = f.querySelector("[name=b]").value.trim() || `über die Steuerseite ergänzt am ${heute()}`;
    portale.push(p); neu();
  };
  box.append(f);
  return box;
}

/* ---------- Beton-Basti ---------- */
function landKarte(l, idx, alle) {
  const inhalt = div();
  const ganz = l.einstellungen.find(z => /^Ganz/i.test(z.k));
  inhalt.append(el(`<h3>Gebiet</h3>`));
  const eb = div(); l.einstellungen.forEach(z => eb.append(feldZeile(z)));
  const mx = {k: "Maximale Nachrichten", v: l.max_nachrichten, b: "Höchstzahl Telegram Nachrichten für dieses Land je Lauf"};
  const mr = feldZeile(mx); mr.querySelector("input").onchange = e => { l.max_nachrichten = e.target.value; neu(); };
  eb.append(mr); inhalt.append(eb);
  if (ganz && /^ja$/i.test(ganz.v)) inhalt.append(el(`<div class="hint">${esc(ganz.k)} ist eingeschaltet. Die Häkchen unten zählen erst, wenn du das ausschaltest.</div>`));

  l.listen.forEach((li, liIdx) => {
    inhalt.append(el(`<h3>${esc(li.titel)}</h3>`));
    li.intro.forEach(t => inhalt.append(el(`<p class="muted" style="margin:0 0 6px;font-size:14px">${esc(ohneCode(t.replace(/^> /, "")))}</p>`)));
    li.gruppen.forEach((g, gi) => {
      const box = el(`<div class="grp"><div class="grp-h"><b>${esc(g.titel || li.titel)}</b></div><div class="chips"></div></div>`);
      const kopf = box.querySelector(".grp-h");
      const alleAn = g.items.length && g.items.every(i => i.an);
      const t = el(`<button class="btn sm">${alleAn ? "Alle abwählen" : "Alle anhaken"}</button>`);
      t.onclick = () => { g.items.forEach(i => i.an = !alleAn); neu(); };
      if (g.items.length) kopf.append(t);
      if (!g.items.length && g.titel) { const x = el(`<button class="x" title="Gruppe entfernen">✕</button>`); x.onclick = () => { li.gruppen.splice(gi, 1); neu(); }; kopf.append(x); }
      const chips = box.querySelector(".chips");
      if (!g.items.length) chips.append(el(`<span class="empty">leer</span>`));
      g.items.forEach((it, ii) => {
        const c = el(`<label class="chip ${it.an ? "on" : ""}"><input type="checkbox" ${it.an ? "checked" : ""}><span>${esc(it.name)}</span><button class="x" title="Entfernen">✕</button></label>`);
        c.querySelector("input").onchange = e => { it.an = e.target.checked; neu(); };
        c.querySelector(".x").onclick = e => { e.preventDefault(); if (confirm(`${it.name} ganz aus der Liste entfernen?`)) { g.items.splice(ii, 1); neu(); } };
        chips.append(c);
      });
      box.append(hinzufuegen("Ort, PLZ, Bezirk oder Kreis hinzufügen", v => {
        if (g.items.some(i => i.name === v)) return alert("Gibt es schon.");
        g.items.push({name: v, an: true});
      }));
      inhalt.append(box);
    });
    const ng = el(`<div class="tools"><button class="btn sm">Gruppe in ${esc(li.titel)} anlegen</button></div>`);
    ng.querySelector("button").onclick = () => {
      const n = prompt("Name der Gruppe, zum Beispiel Oberland"); if (!n) return;
      li.gruppen.push({titel: n.trim(), items: []}); neu();
    };
    inhalt.append(ng);
  });
  const nl = el(`<div class="tools"><button class="btn sm">Neue Liste anlegen, etwa Kantone oder Orte</button></div>`);
  nl.querySelector("button").onclick = () => {
    const n = prompt("Titel der Liste, zum Beispiel Kantone"); if (!n) return;
    if (l.listen.some(x => x.titel === n.trim())) return alert("Gibt es schon.");
    l.listen.push({titel: n.trim(), intro: [], gruppen: [{titel: "", items: []}], outro: []}); neu();
  };
  inhalt.append(nl);

  inhalt.append(el(`<h3>Portale in ${esc(l.name)}</h3>`));
  inhalt.append(portalListe(l.portale, true, "Link zur Suchseite"));

  if (!ORIG.beton.laender.some(o => o.code === l.code)) {
    const w = el(`<div class="tools"><button class="btn sm">Land wieder entfernen</button></div>`);
    w.querySelector("button").onclick = () => { alle.splice(idx, 1); neu(); };
    inhalt.append(w);
  }
  const extra = div();
  extra.className = "order";
  const hoch = el(`<button class="x" title="Nach oben">↑</button>`), runter = el(`<button class="x" title="Nach unten">↓</button>`);
  hoch.onclick = e => { e.preventDefault(); if (idx > 0) { [alle[idx - 1], alle[idx]] = [alle[idx], alle[idx - 1]]; neu(); } };
  runter.onclick = e => { e.preventDefault(); if (idx < alle.length - 1) { [alle[idx + 1], alle[idx]] = [alle[idx], alle[idx + 1]]; neu(); } };
  const sw = schalter(l.aktiv, on => l.aktiv = on); sw.onclick = e => e.stopPropagation();
  extra.append(hoch, runter, sw);
  const kopf = `<span class="flag">${l.flagge}</span> ${esc(l.name)} <span class="muted" style="font-weight:400;font-size:14px">${l.aktiv ? "aktiv" : "aus"}${ganz && /^ja$/i.test(ganz.v) ? ", ganzes Gebiet" : ""}</span>`;
  return klappe("land:" + l.code, kopf, inhalt, extra);
}

function neuesLand() {
  const box = el(`<div class="card"><h2>Land hinzufügen</h2>
    <div style="display:grid;gap:8px;grid-template-columns:1fr 1fr">
      <input type="text" name="name" placeholder="Name, zum Beispiel Schweiz">
      <input type="text" name="code" placeholder="Länderkürzel, zum Beispiel CH" maxlength="2">
      <input type="text" name="region" placeholder="Gebiet, zum Beispiel Graubünden" style="grid-column:1/-1">
      <input type="text" name="liste" placeholder="Bezeichnung der Gebiete, zum Beispiel Kantone oder Regionen" style="grid-column:1/-1">
    </div>
    <div class="tools" style="margin-top:10px"><button class="btn pri">Land anlegen</button></div>
    <p class="muted" style="margin:0;font-size:13px">Danach im neuen Land Orte und Portale eintragen. Lucas prüft die Portale beim Einpflegen.</p></div>`);
  box.querySelector("button").onclick = () => {
    const g = n => box.querySelector(`[name=${n}]`).value.trim();
    const name = g("name"), code = g("code").toUpperCase();
    if (!name || !/^[A-Z]{2}$/.test(code)) return alert("Bitte Name und ein zweistelliges Länderkürzel angeben.");
    if (st.beton.laender.some(l => l.code === code)) return alert("Dieses Land gibt es schon.");
    const region = g("region") || name;
    st.beton.laender.push({
      code, flagge: flagge(code), name, aktiv: true, bedeutung: region,
      einstellungen: [
        {k: "Ganzes Gebiet", v: "ja", b: "Bei ja sucht der Bot im ganzen Gebiet und ignoriert die Häkchen unten. Bei nein zählt nur, was unten angehakt ist"},
        {k: "Region", v: region, b: "Bezugsrahmen für die Portal Abfragen"}],
      listen: [{titel: g("liste") || "Orte", intro: [], gruppen: [{titel: "", items: []}], outro: []}],
      portale: [], max_nachrichten: "10", max_bedeutung: `Obergrenze für den ${code} Block`,
      rahmen_wert: region, rahmen_bedeutung: `seit ${heute()}, über die Steuerseite ergänzt`,
    });
    offen.add("land:" + code); neu();
  };
  return box;
}

function betonTab() {
  const app = div();
  st.beton.einstellungen.forEach(e => {
    const inhalt = div(); e.zeilen.forEach(z => inhalt.append(feldZeile(z)));
    app.append(klappe("rb:" + e.titel, esc(e.titel), inhalt));
  });
  app.append(el(`<h2 style="font-size:18px;margin:22px 0 10px">Länder und Gebiete</h2>`));
  st.beton.laender.forEach((l, i, a) => app.append(landKarte(l, i, a)));
  app.append(neuesLand());
  const aus = el(`<div class="card"><h2>Ausschlussliste</h2><p class="muted" style="margin:0 0 8px">Orte oder Postleitzahlen, die nie gemeldet werden, in keinem Land.</p><div class="chips"></div></div>`);
  const ch = aus.querySelector(".chips");
  if (!st.beton.ausschluss.length) ch.append(el(`<span class="empty">leer</span>`));
  st.beton.ausschluss.forEach((a, i) => {
    const c = el(`<span class="chip on">${esc(a)}<button class="x">✕</button></span>`);
    c.querySelector(".x").onclick = () => { st.beton.ausschluss.splice(i, 1); neu(); };
    ch.append(c);
  });
  aus.append(hinzufuegen("Ort oder PLZ ausschließen", v => { if (!st.beton.ausschluss.includes(v)) st.beton.ausschluss.push(v); }));
  app.append(aus);
  return app;
}

/* ---------- Mietspiegel ---------- */
function mietTab() {
  const app = div(), m = st.miet;
  m.einstellungen.forEach(e => {
    const inhalt = div(); e.zeilen.forEach(z => inhalt.append(feldZeile(z)));
    app.append(klappe("ms:" + e.titel, esc(e.titel), inhalt));
  });
  app.append(klappe("ms:portale", "Portale", portalListe(m.portale, false, "Link zur Miet Suchseite")));
  const pl = div();
  pl.append(el(`<p class="muted" style="margin:0 0 8px">Nur Inserate mit einer Postleitzahl aus dieser Liste fließen in den Mietspiegel ein.</p>`));
  m.plz.forEach((g, gi) => {
    const inh = div();
    const grid = el(`<div class="plz"></div>`);
    g.eintraege.forEach((e, ei) => {
      grid.append(el(`<span>${esc(e.plz)}</span>`), el(`<span>${esc(e.ort)}</span>`));
      const x = el(`<button class="x" title="Entfernen">✕</button>`); x.onclick = () => { g.eintraege.splice(ei, 1); neu(); }; grid.append(x);
    });
    inh.append(grid);
    const f = el(`<div class="add"><input type="text" name="p" placeholder="PLZ" style="flex:0 0 90px"><input type="text" name="o" placeholder="Ort"><button class="btn sm">Hinzufügen</button></div>`);
    f.querySelector("button").onclick = () => {
      const p = f.querySelector("[name=p]").value.trim(), o = f.querySelector("[name=o]").value.trim();
      if (!p || !o) return;
      if (g.eintraege.some(e => e.plz === p && e.ort === o)) return alert("Gibt es schon.");
      g.eintraege.push({plz: p, ort: o}); neu();
    };
    inh.append(f);
    if (!g.eintraege.length) { const w = el(`<div class="tools"><button class="btn sm">Gruppe entfernen</button></div>`); w.querySelector("button").onclick = () => { m.plz.splice(gi, 1); neu(); }; inh.append(w); }
    pl.append(klappe("plz:" + g.titel, `${esc(g.titel)} <span class="muted" style="font-weight:400;font-size:14px">${g.eintraege.length} PLZ</span>`, inh));
  });
  const ng = el(`<div class="tools"><button class="btn sm">Neue Gruppe anlegen, etwa einen Bezirk oder eine Region</button></div>`);
  ng.querySelector("button").onclick = () => {
    const n = prompt("Name der Gruppe, zum Beispiel Bezirk Kufstein oder Kanton Graubünden"); if (!n) return;
    if (m.plz.some(g => g.titel === n.trim())) return alert("Gibt es schon.");
    m.plz.push({titel: n.trim(), eintraege: []}); offen.add("plz:" + n.trim()); neu();
  };
  pl.append(ng);
  app.append(el(`<h2 style="font-size:18px;margin:22px 0 10px">Postleitzahlen</h2>`), pl);
  return app;
}

/* ---------- Senden ---------- */
let von = "", kommentar = "";
try { von = localStorage.getItem("bb-von") || ""; } catch (_) {}
function exportText(ops) {
  const jetzt = new Date(), z = n => String(n).padStart(2, "0");
  const erstellt = `${jetzt.getFullYear()}-${z(jetzt.getMonth() + 1)}-${z(jetzt.getDate())} ${z(jetzt.getHours())}:${z(jetzt.getMinutes())}`;
  const daten = {von, erstellt, basis_stand: ORIG.stand, kommentar, ops};
  return `---
typ: beton-basti-einstellungen
von: "${von.replace(/"/g, "'")}"
erstellt: ${erstellt}
basis_stand: ${ORIG.stand}
---

# Einstellungswunsch Beton-Basti

Von ${von || "unbekannt"}, erstellt am ${erstellt}, auf Basis des Stands vom ${ORIG.stand}.
${kommentar ? "\n> " + kommentar.replace(/\n/g, "\n> ") + "\n" : ""}
## Änderungen

${ops.map(o => "- " + o.text).join("\n")}

## Datenblock

Bitte nicht verändern, dieser Teil wird beim Einpflegen gelesen.

\`\`\`json
${JSON.stringify(daten, null, 1)}
\`\`\`
`;
}
function sendenTab() {
  const ops = aenderungen(), app = div();
  const c = el(`<div class="card"><h2>Deine Änderungen</h2></div>`);
  if (!ops.length) c.append(el(`<p class="empty">Noch nichts geändert. Stell in den anderen Reitern ein, was du möchtest.</p>`));
  else c.append(el(`<ul class="changes">${ops.map(o => `<li>${esc(o.text)}</li>`).join("")}</ul>`));
  app.append(c);
  if (!ops.length) return app;
  const f = el(`<div class="card"><h2>Abschicken</h2>
    <div style="display:grid;gap:8px">
      <input type="text" name="von" placeholder="Dein Name" value="${esc(von)}">
      <textarea name="k" placeholder="Kommentar für Lucas, optional">${esc(kommentar)}</textarea>
    </div>
    <div class="tools" style="margin-top:10px">
      <button class="btn pri" name="dl">Datei herunterladen</button>
      <button class="btn" name="cp">Text kopieren</button>
    </div>
    <p class="muted" style="margin:6px 0 0;font-size:14px">Schick die Datei an Lucas, per Mail oder Nachricht. Sobald er sie eingepflegt hat, zeigt diese Seite den neuen Stand.</p></div>`);
  const vi = f.querySelector("[name=von]"), ki = f.querySelector("[name=k]");
  vi.oninput = () => { von = vi.value.trim(); try { localStorage.setItem("bb-von", von); } catch (_) {} };
  ki.oninput = () => { kommentar = ki.value.trim(); };
  f.querySelector("[name=dl]").onclick = () => {
    if (!von) return alert("Bitte gib deinen Namen an.");
    const blob = new Blob([exportText(ops)], {type: "text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Beton-Basti Einstellungen ${von} ${heute()}.md`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  f.querySelector("[name=cp]").onclick = async e => {
    if (!von) return alert("Bitte gib deinen Namen an.");
    try { await navigator.clipboard.writeText(exportText(ops)); e.target.textContent = "Kopiert"; }
    catch (_) { alert("Kopieren hat nicht geklappt, nimm bitte den Download."); }
  };
  app.append(f);
  const r = el(`<div class="tools"><button class="btn">Alle Änderungen verwerfen</button></div>`);
  r.querySelector("button").onclick = () => { if (confirm("Alle Änderungen verwerfen und zum aktuellen Stand zurück?")) { st = clone(ORIG); neu(); } };
  app.append(r);
  return app;
}

/* ---------- Rahmen ---------- */
function neu() {
  merke();
  const y = scrollY;
  const n = aenderungen().length;
  const tabs = [["beton", "Beton-Basti"], ["miet", "Mietspiegel"], ["senden", "Senden" + (n ? ` <span class="badge">${n}</span>` : "")]];
  const t = document.getElementById("tabs"); t.innerHTML = "";
  tabs.forEach(([id, txt]) => {
    const b = el(`<button class="${tab === id ? "on" : ""}">${txt}</button>`);
    b.onclick = () => { tab = id; neu(); scrollTo(0, 0); };
    t.append(b);
  });
  const app = document.getElementById("app"); app.innerHTML = "";
  if (hinweisEntwurf) app.append(el(`<div class="hint">${esc(hinweisEntwurf)}</div>`));
  app.append(tab === "beton" ? betonTab() : tab === "miet" ? mietTab() : sendenTab());
  scrollTo(0, y);
}
document.getElementById("stand").textContent = `Aktueller Stand der Agenten vom ${ORIG.stand}. Stell ein, was du ändern willst, und schick die Datei unter Senden an Lucas.`;
neu();
</script>
